<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業網頁設計｜首頁</title>

    <style>
        /* ===== 基本設定 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fb;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== 導覽列 ===== */
        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }

        .nav {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }

        .nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav li:hover {
            color: #3498db;
        }

        /* ===== 首頁主視覺 ===== */
        .hero {
            background: linear-gradient(120deg, #3498db, #5dade2);
            color: #fff;
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            margin: auto;
        }

        .hero button {
            margin-top: 30px;
            padding: 12px 28px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: #fff;
            color: #3498db;
            cursor: pointer;
            transition: 0.3s;
        }

        .hero button:hover {
            background: #f1f1f1;
        }

        /* ===== 內容區塊 ===== */
        .section {
            max-width: 1100px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .section h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 30px;
            color: #2c3e50;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #3498db;
        }

        /* ===== 頁尾 ===== */
        footer {
            background: #2c3e50;
            color: #ccc;
            text-align: center;
            padding: 30px 20px;
            margin-top: 80px;
        }

        footer p {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- 導覽列 -->
    <header>
        <nav class="nav">
            <div class="logo">WebDesign</div>
            <ul>
                <li><a href="#">首頁</a></li>
                <li><a href="#">服務</a></li>
                <li><a href="#">作品</a></li>
                <li><a href="#">聯絡我們</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主視覺 -->
    <section class="hero">
        <h1>專業網頁設計與品牌形象</h1>
        <p>我們專注於打造現代化、易用且具美感的網站，幫助品牌在數位世界中脫穎而出。</p>
        <button>了解更多</button>
    </section>

    <!-- 服務介紹 -->
    <section class="section">
        <h2>我們的服務</h2>
        <div class="cards">
            <div class="card">
                <h3>網站設計</h3>
                <p>量身打造符合品牌形象的專業網站，兼顧美感與實用性。</p>
            </div>
            <div class="card">
                <h3>響應式設計</h3>
                <p>適用於手機、平板與電腦，任何裝置都有最佳體驗。</p>
            </div>
            <div class="card">
                <h3>UI / UX 規劃</h3>
                <p>以使用者為中心，提升互動性與轉換率。</p>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer>
        <p>© 2025 WebDesign. All Rights Reserved.</p>
    </footer>

</body>
</html>
